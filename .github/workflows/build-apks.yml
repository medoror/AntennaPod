name: Build APKs

on:
  push:
    branches: [ develop, master ]
  pull_request:
    branches: [ develop, master ]
  workflow_dispatch:

jobs:
  test:
    name: "Unit Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Configure parallel build
        run: echo "org.gradle.parallel=true" >> local.properties

      - name: Create temporary release keystore
        run: keytool -noprompt -genkey -v -keystore "app/keystore" -alias alias -storepass password -keypass password -keyalg RSA -validity 10 -dname "CN=antennapod.org, OU=dummy, O=dummy, L=dummy, S=dummy, C=US"

      - name: Run unit tests
        run: ./gradlew testFreeDebugUnitTest testPlayDebugUnitTest

  build-fdroid-apk:
    name: "Build F-Droid APK"
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Configure parallel build
        run: echo "org.gradle.parallel=true" >> local.properties

      - name: Create temporary release keystore
        run: keytool -noprompt -genkey -v -keystore "app/keystore" -alias alias -storepass password -keypass password -keyalg RSA -validity 10 -dname "CN=antennapod.org, OU=dummy, O=dummy, L=dummy, S=dummy, C=US"

      - name: Build F-Droid Release APK
        run: ./gradlew assembleFreeRelease

      - name: Upload F-Droid APK
        uses: actions/upload-artifact@v4
        with:
          name: app-free-release.apk
          path: app/build/outputs/apk/free/release/app-free-release.apk
          retention-days: 30

  build-play-apk:
    name: "Build Play Store APK"
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Configure parallel build
        run: echo "org.gradle.parallel=true" >> local.properties

      - name: Create temporary release keystore
        run: keytool -noprompt -genkey -v -keystore "app/keystore" -alias alias -storepass password -keypass password -keyalg RSA -validity 10 -dname "CN=antennapod.org, OU=dummy, O=dummy, L=dummy, S=dummy, C=US"

      - name: Build Play Release APK
        run: ./gradlew assemblePlayRelease

      - name: Upload Play APK
        uses: actions/upload-artifact@v4
        with:
          name: app-play-release.apk
          path: app/build/outputs/apk/play/release/app-play-release.apk
          retention-days: 30

  build-debug-apks:
    name: "Build Debug APKs"
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Configure parallel build
        run: echo "org.gradle.parallel=true" >> local.properties

      - name: Build Debug APKs
        run: ./gradlew assembleFreeDebug assemblePlayDebug

      - name: Upload F-Droid Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-free-debug.apk
          path: app/build/outputs/apk/free/debug/app-free-debug.apk
          retention-days: 7

      - name: Upload Play Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-play-debug.apk
          path: app/build/outputs/apk/play/debug/app-play-debug.apk
          retention-days: 7

  create-release:
    name: "Create Release"
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master'
    needs: [build-fdroid-apk, build-play-apk, build-debug-apks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version from commit count
        id: version
        run: |
          VERSION=$(git rev-list --count HEAD)
          echo "version=v1.0.$VERSION" >> $GITHUB_OUTPUT
          echo "Generated version: v1.0.$VERSION"

      - name: Download F-Droid Release APK
        uses: actions/download-artifact@v4
        with:
          name: app-free-release.apk
          path: ./

      - name: Download Play Release APK
        uses: actions/download-artifact@v4
        with:
          name: app-play-release.apk
          path: ./

      - name: Download F-Droid Debug APK
        uses: actions/download-artifact@v4
        with:
          name: app-free-debug.apk
          path: ./

      - name: Download Play Debug APK
        uses: actions/download-artifact@v4
        with:
          name: app-play-debug.apk
          path: ./

      - name: Generate changelog
        id: changelog
        run: |
          CHANGELOG=$(git log --oneline -5 --pretty=format:"- %s (%h)")
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: AntennaPod ${{ steps.version.outputs.version }}
          body: |
            ## What's Changed
            ${{ steps.changelog.outputs.changelog }}

            ## Downloads
            - **F-Droid Release**: app-free-release.apk (recommended for F-Droid users)
            - **Play Store Release**: app-play-release.apk (includes Chromecast support)
            - **Debug Builds**: For testing purposes only

            The F-Droid release APK is compatible with F-Droid and excludes proprietary components.
          files: |
            app-free-release.apk
            app-play-release.apk
            app-free-debug.apk
            app-play-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
